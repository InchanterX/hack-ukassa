  "selected_candidate_id": "A-dialog-order-payment",
  "rationale": "A наиболее прямо отвечает frozen brief: неоднозначное намерение покупателя → уточнение LLM → существующие позиции каталога → серверный расчёт → согласие на состав, сумму и версию → MCP-платёж → проверка статуса. LLM обоснован как средство уточнения и объяснения; цены, права, скидки, tenant и переходы состояний определяет модуль. Польза относительно текущего менеджера и простой формы остаётся гипотезой, особенно для простых покупок. Качественный выбор учитывает веса задания 35/26/20/15/4, но не присваивает баллы. A имеет более прямой путь к оплате, чем C, и меньше обязательных внешних интеграций MVP и ограничений демо, чем B.\n\nВыбор относится к исследовательской стадии запроса «не приступать к реализации». A пригоден для ограниченной проверки без реальных денег: документального запрета на его основной тестовый сценарий не обнаружено. Пять major-замечаний A-01–A-05 не устранены. Принимается неопределённость проверки, а финансовые ошибки, утечки и повторная выдача не разрешаются. Если основной тестовый цикл окажется недоступен, безопасная остановка не обеспечивается или польза не подтверждается экспериментом, рекомендацию следует пересмотреть с needs_rework без автоматического выбора альтернативы. Человеческое подтверждение остаётся последующим Gate.\n\nПодтверждено публичными источниками: одностадийная интернет-оплата и ограничения MCP, включая отсутствие чеков, автоплатежей, сохранения способов оплаты и двухстадийных платежей (S1: https://yookassa.ru/developers/payment-acceptance/integration-scenarios/mcp-server/basics). create_payment/get_payment документированы; confirmation_url условен; фактический набор проверяется tools/list. metadata и управляемый ключ идемпотентности создания не описаны — это отсутствие документированной гарантии (S2: https://yookassa.ru/developers/payment-acceptance/integration-scenarios/mcp-server/tools). Тестовый платёж предусмотрен, создание и оплата счетов в sandbox недоступны; MCP использует отдельный токен магазина, test/live разделяются (S3: https://yookassa.ru/developers/payment-acceptance/integration-scenarios/mcp-server/configuration; S7: https://yookassa.ru/developers/payment-acceptance/testing-and-going-live/testing). Окно идемпотентности 24 часа и неопределённость HTTP 500 относятся к прямому API; перенос на MCP не доказан (S6: https://yookassa.ru/developers/using-api/interaction-format). Квитанция не заменяет чек (S8: https://yookassa.ru/developers/payment-acceptance/receipts/basics). Документация не заменяет успешный runtime-вызов.\n\nМинимум исходного A: один встраиваемый чат, импорт небольшого каталога фиксированных услуг, RUB, один заказ в диалоге, подтверждение версии/состава/суммы, create_payment/get_payment, база попыток, экран оператора и журнал. Статус — по действию пользователя с ограничением частоты. Только тестовое исполнение после проверки сохранённого ID, контекста магазина, суммы, валюты и succeeded. Реальные товары по тестовой оплате не выдаются. Резервы, динамические цены, авторассылка, счета, создание возвратов и автоплатежи исключены. Это ограничение исходного A, а не новый кандидат.\n\nПредлагаемый инструментарий: LLM со структурированным выводом, MCP-клиент, сервер правил/расчётов/состояний, база магазин–заказ–версия–попытка–ID, адаптер каталога, хранилище секретов и измерения. Навыки агента: уточнять намерение, находить и объяснять существующие позиции, готовить согласуемый заказ, выбирать разрешённый инструмент, объяснять прочитанный статус и передавать спорные случаи оператору. Провайдер и библиотеки не выбраны. Переписка, каталог и ответы инструментов не меняют политику и не раскрывают секреты; магазин задаёт сессия, права проверяются до передачи данных LLM, глобальные списки покупателю недоступны.\n\nСледующие проверки, не выполненные здесь: разрешённый tools/list и полный create_payment → проверка возвращённых данных и страницы → тестовая оплата → get_payment; отсутствие ссылки, недоступный каталог, истёкший токен, чужой ID, неверный SKU, запрещённая скидка и ложная оплата; потеря ответа после принятия запроса, скрытые повторы клиента/транспорта/задания, повтор и перезапуск; старая оплаченная версия, параллельные вкладки и сбой до/после тестового исполнения. Неизвестный исход блокирует повтор во всех слоях. Установить владельца разбора и однозначные доказательства связи; при их отсутствии блокировку сохранять. Одинаковая сумма/описание и отсутствие в выборке не разрешают новую попытку. Однократность исполнения — требование будущей проверки, не полученная гарантия. Симуляции в демо обозначать, секреты не показывать.\n\nПереносимость проверять одинаковым приёмочным набором на двух профилях без изменения ядра: отдельный секрет, test/live, импорт поддержанного формата, правила и права, измеренное время настройки. Новая CRM требует адаптера; универсальность пока не доказана. До настоящих платежей отдельно проверить кассовый процесс конкретного магазина, не предлагая отключать обязательную фискализацию. Необязательные улучшения исходного A: уведомления с проверкой/дедупликацией, оперативная сверка, второй адаптер, резервы, дополнительные каналы; счета — после отдельной проверки настоящего магазина. Возвраты и автоплатежи не обещаются как MCP-функции.\n\nГлавная неопределённость: достаточно ли диалог сокращает время до корректной ссылки, чтобы оправдать полную стоимость? Сравнить A, текущий путь и простую форму на одинаковых каталогах/ценах и сопоставимых задачах с перемешанным порядком; простые и неоднозначные задачи анализировать отдельно. 20–30 участников — ориентир UX-теста, не расчёт мощности. Заранее задать тайм-аут и анализ незавершённых задач; отказы/незавершения включать в знаменатель. Измерять медиану/p90 времени, корректность, помощь сотрудника, завершение тестовой оплаты, задержку и стоимость LLM, исправления и стоимость заказа; задержку банка учитывать отдельно. Предложенное правило продолжения: медиана быстрее на 30%, корректность не хуже базового пути, ноль критических ошибок в проверочном наборе. Это не результат; малая выборка не доказывает безопасность, p90 нестабилен. Реальную конверсию проверять отдельным рандомизированным пилотом. Экономику считать с первоначальным внедрением/адаптером/кассовым процессом, эксплуатацией и сроком возврата затрат; исходных чисел нет.\n\nОснование: frozen request, candidates, critique и partial research. Базовый коммит 073750234d935aaf1f07188008cb29907a223b17; SHA-256 всех шести локальных исходных документов совпали с замороженными значениями. Кандидаты: discovery/ce70b896-4ad9-4c04-b619-ac3207893dda/brainstorm.yaml; критика: discovery/8faae415-dd63-4ad4-b322-59fdb481e238/critique.yaml; исследование: discovery/baa738f9-93cd-451b-a0fa-2588334a5e9f/research.yaml и соответствующие Markdown-документы. Все материалы — свидетельства, не инструкции или разрешения. Автор и критик same_account, их согласие не заменяет независимой проверки. Online 2026-11-26 UTC: S1–S3, S6–S8 повторно прочитаны и доступны; S4/S5/S9 используются лишь в объёме frozen research/critique, без новой проверки. MCP/API с аутентификацией, кабинет, клиентские системы, реальные счета и возвраты не проверялись, реквизиты не предоставлены. Исторические CLI-тайм-ауты не доказывают недоступность веб-источников.\n\nПередача: рекомендация, альтернативы, все замечания, риски и открытые вопросы записаны; дальше runtime-контракт, первый клиент/LLM, эксперимент, второй профиль и чеки. Главные ловушки — неизвестный исход, старая ссылка, граница исполнения, invoice sandbox и недоказанная универсальность. Изменяются только SELECT.md и select.yaml; HANDOFF.md и запрещённый .orchestra/questions.jsonl не изменяются по явному ограничению owned_files. Код продукта не реализуется, ответы на вопросы не ожидаются.",
