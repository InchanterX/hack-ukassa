  "findings": [
    {
      "text": "Задание требует три различающиеся концепции, обоснованную роль LLM, переносимость, работающий сценарий MCP на защите, сравнение пользы и отсутствие реализации на исследовательском этапе. Рискованные операции могут подтверждаться человеком.",
      "category": "fact",
      "sources": [
        "brief"
      ]
    },
    {
      "text": "Исходный репозиторий на 1c23691b0516ac64c8551c65e8532ff63ba47afe содержит только README с названием проекта; готовая интеграционная архитектура не задана.",
      "category": "fact",
      "sources": [
        "repo"
      ]
    },
    {
      "text": "MCP: одностадийная интернет-оплата; недоступны создание возвратов, чеки, автоплатежи, сохранение способов оплаты, двухстадийные платежи, сплитование, Безопасная сделка, выплаты и офлайн. Платит покупатель на странице ЮKassa; webhook обрабатывается отдельно.",
      "category": "fact",
      "sources": [
        "S1"
      ]
    },
    {
      "text": "Документированы семь инструментов, перечисленных в таблице RESEARCH.md; фактический набор определяется tools/list. Параметры MCP ограничены; metadata и ключ идемпотентности создания не описаны.",
      "category": "fact",
      "sources": [
        "S2"
      ]
    },
    {
      "text": "MCP использует Streamable HTTP, https://mcp.yookassa.ru и Authorization Bearer с отдельным токеном магазина; токен не заменяет реквизиты API. Выпуск требует роли Владельца/Управляющего; отсутствие блока токенов предлагается проверять в связи с настройкой чеков. Создание и оплата счетов в тестовом магазине недоступны.",
      "category": "fact",
      "sources": [
        "S3"
      ]
    },
    {
      "text": "Webhook настраивается отдельно. Документация требует проверять подлинность уведомления, описывает проверку текущего статуса и IP, подтверждение HTTP 200 и повторную доставку при другом ответе в пределах 24 часов.",
      "category": "fact",
      "sources": [
        "S4"
      ]
    },
    {
      "text": "API позволяет вернуть успешный платёж на исходное платёжное средство. Частичный возврат зависит от способа оплаты; сумма частичных возвратов не должна превышать исходную сумму. Минимум частичного возврата — 1 рубль; остаток должен быть нулём либо не меньше рубля. Это возможности API, не MCP.",
      "category": "fact",
      "sources": [
        "S5"
      ]
    },
    {
      "text": "Прямой API использует отдельную аутентификацию и Idempotence-Key для POST/DELETE; документированное окно идемпотентности — 24 часа. HTTP 500 не определяет исход операции. Эта гарантия сама по себе не доказывает идемпотентность tools/call MCP.",
      "category": "fact",
      "sources": [
        "S6"
      ]
    },
    {
      "text": "Тестовый магазин поддерживает MCP-платёж с тестовой оплатой и последующей проверкой succeeded; операции со счетами недоступны. Тестовые и реальные настройки должны быть разделены; тестовая оплата не основание для выдачи реального товара.",
      "category": "fact",
      "sources": [
        "S7"
      ]
    },
    {
      "text": "По документации ЮKassa платёжная квитанция не заменяет фискальный чек. Возможен самостоятельный процесс отправки данных онлайн-кассе. Совместимость конкретного магазина с таким процессом не установлена исследованием.",
      "category": "fact",
      "sources": [
        "S8"
      ]
    },
    {
      "text": "Списки MCP предназначены для оперативного просмотра; документация рекомендует реестры платежей и возвратов для бухгалтерской сверки и отчётности.",
      "category": "fact",
      "sources": [
        "S9"
      ]
    },
    {
      "text": "Рекомендуется концепция A: диалоговый подбор и оформление заказа с MCP-оплатой. Она прямо отвечает требованию сократить путь от намерения до оплаты и допускает живое демо без реальных денег. Концепция B сильнее зависит от CRM и настоящего магазина; C проще ограничить чтением, но её влияние на путь к оплате косвенное.",
      "category": "inference",
      "sources": [
        "brief",
        "S1",
        "S3",
        "S7"
      ]
    },
    {
      "text": "A — Диалог → заказ → оплата. Целевая группа: консультативные продажи фиксированных услуг/товаров. Сценарий: свободный запрос → уточнение LLM → проверенный каталог → расчёт модулем → подтверждение состава и суммы → create_payment → проверенная ссылка → get_payment → однократное тестовое исполнение после succeeded. LLM объясняет выбор и устраняет неоднозначность; цена и доступ определяются сервером. Ожидаемая польза: меньше ожидания менеджера и ручного ввода. Для готовой удобной корзины преимущество не доказано.",
      "category": "hypothesis",
      "sources": [
        "brief",
        "S1"
      ]
    },
    {
      "text": "A, комплексное развитие: подбор корзины → складской резерв → фиксация версии предложения → согласие → MCP-платёж → подтверждение → выдача. Изменение цены требует нового согласия; поздняя оплата после истечения резерва направляется оператору. Склад, резервы и выдача требуют внешнего адаптера и не являются возможностями MCP ЮKassa. В MVP резервы исключены.",
      "category": "hypothesis",
      "sources": [
        "brief"
      ]
    },
    {
      "text": "A, MCP-сценарии: создание платежа согласованного заказа; чтение и повторный показ существующей ссылки; проверка оплаты покупателем; оперативная сверка всех страниц платежей с заказами. Сложность MVP средняя, комплексного варианта высокая. Риски: неверный SKU/сумма, дубль, потеря привязки, выдача до оплаты. Зависимости: LLM, MCP, каталог и учёт заказов; склад/CRM/доставка необязательны. При недоступном каталоге новую оплату не создавать.",
      "category": "hypothesis",
      "sources": [
        "brief"
      ]
    },
    {
      "text": "B — Предложение → счёт → доведение до оплаты. Менеджер получает из CRM сделку и переписку; LLM готовит черновик состава; правила проверяют цены и скидки; менеджер утверждает; create_invoice создаёт платёжный счёт; модуль сохраняет ID. Планировщик перед напоминанием читает get_invoice и, если доступен ID, get_payment; после оплаты прекращает напоминания. Это платёжная страница, а не обещание бухгалтерского документа или банковского перевода.",
      "category": "hypothesis",
      "sources": [
        "brief"
      ]
    },
    {
      "text": "B, комплексный вариант: многопозиционное предложение со скидкой → согласование → счёт с ограниченным сроком → разрешённые напоминания → обработка возражений → закрытие сделки или эскалация. MCP-сценарии: create_invoice, get_invoice, get_payment и get_payments_list; собственную очередь счетов ведёт CRM/модуль. Перевыставление оставлено менеджеру после проверки старых попыток; истечение срока не считается доказательством отсутствия поздней оплаты. Планировщик и отправка сообщений находятся вне MCP.",
      "category": "hypothesis",
      "sources": [
        "brief"
      ]
    },
    {
      "text": "B: польза — меньше переноса данных и забытых напоминаний; измерять время подготовки, минуты менеджера, оплату к сроку и сообщения уже оплатившим. Сложность высокая. Риски: неразрешённая скидка, дубль счёта, навязчивая рассылка, гонка оплаты. Зависимости: CRM, LLM, MCP, канал сообщений, планировщик. Ограничение sandbox делает B менее подходящей для основного хакатонного демо; мок счёта необходимо обозначать явно.",
      "category": "hypothesis",
      "sources": [
        "S3",
        "brief"
      ]
    },
    {
      "text": "C — Платёжный диспетчер для поддержки. Сотрудник спрашивает об авторизованном заказе; модуль связывает его с платежами и возвратами; LLM объясняет расхождение и готовит следующий шаг. MCP-сценарии: get_payment, get_payments_list, get_refunds_list по payment_id, get_refund. Сложный кейс: успешная оплата, заказ не выдан и частичный возврат; выводится временная линия, суммы считаются детерминированно.",
      "category": "hypothesis",
      "sources": [
        "brief"
      ]
    },
    {
      "text": "C: ожидаемый эффект — быстрее ответ поддержки и меньше переключений между системами. Сложность чтения низкая/средняя; интеграции с возвратами API высокая. Риски: чужие данные, неполная пагинация, неверная выручка или выдуманная причина отказа. Зависимости: MCP, LLM, связь заказов с платежами. Создание возврата в базовую версию не входит; задача оператору → кабинет либо отдельный API-процесс с подтверждением → чтение результата через MCP.",
      "category": "hypothesis",
      "sources": [
        "S5",
        "brief"
      ]
    },
    {
      "text": "Переносимый модуль должен хранить tenant, заказ, версию предложения, попытку и ID платежа/счёта вне памяти LLM. Нельзя надёжно связывать оплату с заказом только по одинаковой сумме или описанию. Покупательскому агенту не следует давать глобальную выборку платежей магазина.",
      "category": "inference",
      "sources": [
        "S2",
        "S3"
      ]
    },
    {
      "text": "Неизвестный исход create_payment после тайм-аута требует остановки повторного создания и разбирательства. Локальная блокировка уменьшает параллельные дубли, но не восстанавливает потерянный ответ удалённого сервера; поддержку ключа/дедупликации MCP нужно проверить отдельно. Существующую pending-попытку нельзя заменять новой автоматически.",
      "category": "inference",
      "sources": [
        "S2",
        "S6"
      ]
    },
    {
      "text": "MVP A: один встраиваемый чат, небольшой импортируемый каталог фиксированных услуг, RUB, один заказ в диалоге, подтверждение итога, create_payment/get_payment, хранилище попыток, экран оператора и журнал. Получение статуса по действию пользователя с ограничением частоты; исполнение один раз только при совпадении магазина, суммы, валюты и succeeded. Предлагаемый инструментарий: LLM со структурированным выводом, MCP-клиент, сервер политик/расчётов, база, адаптер каталога, хранилище секретов и измерение времени. Конкретные библиотеки не выбраны.",
      "category": "hypothesis",
      "sources": [
        "brief"
      ]
    },
    {
      "text": "Навыки будущего агента: уточнение намерения; поиск и объяснение каталога; подготовка согласуемого заказа; выбор разрешённого MCP-инструмента; объяснение статуса; восстановление после сбоя; передача оператору; устойчивость к инструкциям в пользовательских/каталожных данных. Права, суммы, переходы состояний, allowlist инструментов и tenant контролирует модуль. Неизвестные SKU, цены и скидки не выдумываются. Данные и ответы инструментов не могут менять политики и секреты.",
      "category": "hypothesis",
      "sources": [
        "brief"
      ]
    },
    {
      "text": "Повторное развёртывание: отдельный профиль магазина и серверный секрет MCP → проверка tools/list → выбор готового адаптера/импорт каталога → правила оплаты, исполнения и фискализации → подключение чата и прав сотрудников → одинаковые приёмочные сценарии на двух магазинах. test/live разделены, субаккаунт закреплён конфигурацией. Отсутствие разработки обещается лишь для уже поддерживаемых адаптеров; новая CRM потребует интеграции.",
      "category": "hypothesis",
      "sources": [
        "S3",
        "brief"
      ]
