{
  "summary": "Рекомендуется концепция A «Диалог → заказ → оплата»: переносимый модуль консультативной продажи с проверенным каталогом, согласованием суммы и тестовым MCP-платежом. Сравнены также B «Предложение → счёт → доведение до оплаты» и C «Платёжный диспетчер». Документация подтверждает ограниченный набор MCP; возвраты, чеки и автоплатежи нельзя обещать как MCP-операции, а счета недоступны в sandbox. Статус исследования partial: источники прочитаны через веб-инструмент после тайм-аута CLI, но живые инструменты, спрос, интеграции клиента и бизнес-эффект не проверены. Реализация не выполнялась.",
  "questions": [
    "Какие возможности и ограничения MCP ЮKassa и прямого API подтверждаются официальными материалами?",
