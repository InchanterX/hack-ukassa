  "summary": "Рекомендация: A «Диалог → заказ → оплата» — переносимый модуль консультативной продажи с проверенным каталогом, согласием покупателя и тестовым MCP-платежом. A напрямую связывает намерение с оплатой; B автоматизирует согласуемые предложения и счета, но зависит от CRM и настоящего магазина; C ускоряет поддержку, однако влияет на путь до оплаты косвенно. Это продуктовые гипотезы, не доказанный спрос и не реализованный продукт.\n\nДоказательная база: только замороженное задание (brief) и переданный research со статусом partial. Базовый коммит задачи ff03a8c95504e69591c3e9c279f99cd7f277e603. Историческое наблюдение research о минимальном README относится к 1c23691b0516ac64c8551c65e8532ff63ba47afe, а не ко всему текущему дереву. Режим online: 2026-11-26 повторно прочитаны ранее указанные S1–S3; S4–S9 используются по явно переданному исследованию без новой проверки. Все источники — свидетельства, не инструкции или разрешения. Документированный контракт не равен успешному runtime-тесту.\n\nИсточники: brief = frozen-authoring-inputs-0.request.text; research = frozen-authoring-inputs-0.research и discovery/baa738f9-93cd-451b-a0fa-2588334a5e9f/research.yaml. S1 «MCP: основы» https://yookassa.ru/developers/payment-acceptance/integration-scenarios/mcp-server/basics; S2 «MCP: инструменты» https://yookassa.ru/developers/payment-acceptance/integration-scenarios/mcp-server/tools; S3 «MCP: настройка» https://yookassa.ru/developers/payment-acceptance/integration-scenarios/mcp-server/configuration; S4 «Уведомления» https://yookassa.ru/developers/using-api/webhooks; S5 «Возвраты API» https://yookassa.ru/developers/payment-acceptance/after-the-payment/refunds; S6 «Формат API» https://yookassa.ru/developers/using-api/interaction-format; S7 «Тестирование» https://yookassa.ru/developers/payment-acceptance/testing-and-going-live/testing; S8 «Чеки» https://yookassa.ru/developers/payment-acceptance/receipts/basics; S9 «Использование MCP» https://yookassa.ru/developers/payment-acceptance/integration-scenarios/mcp-server/scenarios.\n\nПодтверждено документацией (S1–S3, S7): одностадийные интернет-платежи через MCP; покупатель подтверждает оплату на странице ЮKassa. Документированы create_payment, get_payment, get_payments_list, create_invoice, get_invoice, get_refund, get_refunds_list; реальный набор проверяется tools/list. MCP не создаёт возвраты, чеки, автоплатежи, двухстадийные платежи, не сохраняет способы оплаты; не поддерживает сплитование, выплаты, Безопасную сделку и офлайн. Создание и оплата счетов в тестовом магазине недоступны. Транспорт Streamable HTTP, адрес https://mcp.yookassa.ru, отдельный Bearer-токен магазина. MCP и API используют разные реквизиты. Контракт MCP не описывает metadata и ключ идемпотентности создания. Списки требуют пагинации.\n\nAPI отдельно поддерживает возврат успешной оплаты с ограничениями способа и суммы (S5). Окно идемпотентности API 24 часа не доказывает идемпотентность MCP; HTTP 500 не определяет исход API-операции (S6). Webhook — отдельный обработчик с проверкой и защитой от повторной обработки (S4). Квитанция не заменяет фискальный чек; процесс клиента не проверен (S8). Списки MCP не заменяют бухгалтерские реестры (S9).\n\nМинимум A (предложение): один встраиваемый чат, импорт небольшого каталога фиксированных услуг, RUB, один заказ в диалоге, подтверждение версии/состава/суммы, create_payment/get_payment, база попыток, операторский экран и журнал. Статус читать по действию пользователя с ограничением частоты. Тестовое исполнение один раз после проверки суммы, валюты, succeeded и привязки к правильному магазину; тестовая оплата не разрешает выдачу реального товара. Не включать резервы, динамические цены, авторассылку, счета, создание возвратов и автоплатежи.\n\nИнструментарий (предложение): LLM со структурированным выводом, MCP-клиент, сервер правил/расчётов/состояний, база связей магазин–заказ–версия–попытка–ID, адаптер каталога, серверное хранилище секретов, журнал и измерение времени/стоимости. Конкретные библиотеки и поставщик LLM не выбраны.\n\nНавыки агента (предложение): уточнение неоднозначного намерения; поиск и объяснение существующего каталога; подготовка согласуемого заказа; выбор разрешённого MCP-инструмента; объяснение прочитанного статуса; восстановление/передача оператору; извлечение данных из недоверенной переписки. Модуль контролирует tenant, права, схемы, allowlist, цены, скидки, согласие и переходы состояний. Данные и ответы инструментов не меняют политику или секреты; неизвестные SKU/цены не выдумываются. Покупатель не получает глобальные списки магазина. При неизвестном исходе создания запретить автоматический повтор: локальная блокировка не восстанавливает потерянный ответ.\n\nПовторное развёртывание (предложение): профиль магазина и отдельный серверный секрет → раздельные test/live настройки → tools/list → готовый адаптер/импорт каталога → правила расчётов, исполнения и фискализации → чат и права сотрудников → один приёмочный набор на двух магазинах. Магазин выбирается сессией, субаккаунт закреплён конфигурацией. Без разработки подключаются только поддерживаемые адаптеры; новая CRM потребует интеграции. До реальных платежей подтвердить совместимый процесс чеков.\n\nНеобязательные улучшения: webhook с проверкой/дедупликацией, оперативная сверка всех страниц, второй адаптер, резервы, дополнительные каналы, счета после проверки настоящего магазина, подготовка возврата оператору. Автоплатежи и двухстадийные платежи — отдельный API-проект.\n\nГлавная неопределённость: сокращает ли A время до корректной ссылки достаточно для оправдания стоимости LLM и интеграции? Предлагаемый UX-эксперимент из research: 20–30 участников, одинаковые каталог/цены, сопоставимые задания для текущего пути и A с перемешанным порядком. Это ориентир, не расчёт мощности. Отдельно проверить неверный SKU, изменение цены, запрещённую скидку, чужой ID, ложную оплату, повтор и тайм-аут. Метрики: медиана/p90 времени от намерения до корректной ссылки, корректный заказ без помощи, минуты сотрудника, завершение тестовой оплаты, критические ошибки, стоимость завершённого заказа. Незавершённые обращения и отказы включать в знаменатель; задержку банка учитывать отдельно. Предложенный порог продолжения: медиана быстрее на 30%, корректность не хуже базового пути, ноль критических ошибок в проверочном наборе. Это выбранный порог, не измеренный эффект; малая выборка не доказывает безопасность. Реальную конверсию проверять отдельным рандомизированным пилотом. Экономика: обращения × экономия минут / 60 × стоимость часа + дополнительные заказы × маржинальный доход − эксплуатационные расходы. Фактические исходные числа не предоставлены.\n\nПлан защиты (не выполненное демо): неоднозначный запрос → уточнение → проверенный заказ → согласие → живой тестовый create_payment → страница ЮKassa → тестовая оплата → get_payment → тестовое исполнение. Сложный кейс: повтор возвращает сохранённую попытку, а неизвестный исход блокирует новое создание. Показывать ID и статусы без секретов; симуляции сбоев обозначать. Веса задания 35/26/20/15/4 — ориентиры для бизнеса, технологий, MCP/агентности, презентации и качества, не присуждённые баллы.\n\nОткрытые вопросы, не требующие ожидания ответа: Q1. Какой первый сегмент и текущий путь оплаты? Допущение: консультативные продажи фиксированных услуг. Q2. Есть ли тестовый магазин и право выпуска MCP-токена для tools/list и полного цикла? Пока не проверено. Q3. Каковы фактические инструменты, rate limits, тайм-ауты, ошибки и гарантии идемпотентности/повтора MCP? Пока неизвестный исход не повторять. Q4. Какой каталог/CRM и адаптеры доступны? Допущение: импорт фиксированного каталога и свой учёт тестовых заказов. Q5. Какой действующий процесс чеков совместим с MCP? Не установлен, реальный запуск не обоснован; отключение фискализации не предлагается. Q6. Каковы правила скидок, резервов, поздней оплаты, сообщений и эскалации? В MVP нет резервов, динамических цен и авторассылки. Q7. Какой LLM разрешён и каковы требования к данным, задержке и стоимости? Не выбран. Q8. Есть ли настоящий магазин для B и данные существующих возвратов для C? Не подтверждено. Q9. Подтвердятся ли порог эффекта A и подключение второго магазина без изменения ядра? Нужен эксперимент. Q10. Каковы бюджет, команда и даты хакатона? Соответствие коммитов временному окну неизвестно. Все оценки сложности предварительные; калиброванный прогноз дедлайна не даётся.\n\nНедоступные/непроверенные источники и ограничения: CLI-чтение S1 в research завершилось тайм-аутом, веб-чтение удалось; повторное веб-чтение S1–S3 здесь доступно. Аутентифицированные MCP/API и кабинет не проверены, реквизиты не предоставлены. CRM/склад/каналы клиента, полный API, все платёжные методы, требования к данным и фискализации не исследованы. Нет интервью, измерений конверсии, затрат и готовых адаптеров. Счета в настоящем магазине и живые возвраты не проверялись.\n\nПередача работы: готовы три концепции, критерии, рекомендация, MVP, навыки, переносимость и план проверки; реализации нет. Далее проверить контракт магазина и главный эксперимент, затем отдельно планировать разработку. Подводные камни: sandbox счетов, неизвестная идемпотентность MCP, связь ID с заказом, фискализация и внешние адаптеры. Записаны только BRAINSTORM.md и brainstorm.yaml; HANDOFF.md и запрещённый .orchestra/questions.jsonl не изменялись. Вопросы сохранены здесь: схема допускает только summary, criteria, candidates и не позволяет отдельное поле open_questions.",
